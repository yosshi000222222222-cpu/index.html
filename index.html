<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Progress Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        .ui {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: white; pointer-events: none; z-index: 10; width: 90%;
        }
        #counter { font-size: 3.5rem; font-weight: 100; text-shadow: 0 0 20px rgba(255,255,255,0.5); margin-bottom: 2px; }
        .label { font-size: 0.6rem; letter-spacing: 2px; opacity: 0.5; margin-bottom: 8px; }
        .stats-row {
            display: flex; justify-content: center; align-items: center; gap: 8px;
            font-family: 'Courier New', Courier, monospace; margin-top: 5px;
        }
        #total-seconds { font-size: 0.8rem; opacity: 0.3; font-weight: 100; }
        #percentage { font-size: 0.8rem; opacity: 0.6; }
        #permission-btn {
            position: absolute; top: 20px; right: 20px; padding: 10px;
            background: rgba(255,255,255,0.1); color: white; border: 1px solid white;
            border-radius: 5px; font-size: 10px; z-index: 100;
        }
    </style>
</head>
<body>

<button id="permission-btn" onclick="requestPermission()">Sensor ON</button>

<div class="ui">
    <div class="label">REMAINING / TOTAL SECONDS</div>
    <div id="counter">0</div>
    <div style="width: 40%; height: 1px; background: rgba(255,255,255,0.15); margin: 10px auto;"></div>
    <div class="stats-row">
        <div id="total-seconds">/ 0</div>
        <div id="percentage">(0.0000%)</div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const counterEl = document.getElementById('counter');
    const totalEl = document.getElementById('total-seconds');
    const percentEl = document.getElementById('percentage');

    let width, height, hue = 280;
    let particles = [];
    let pulses = [];
    let lastSecond = -1;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor(isFlying = false) {
            this.init(isFlying);
        }
        init(isFlying) {
            this.x = Math.random() * width;
            this.y = isFlying ? height - 50 : -20;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = isFlying ? -(Math.random() * 15 + 5) : Math.random() * 2 + 1;
            this.size = Math.random() * 2 + 1;
            this.color = `hsl(${hue}, 100%, 70%)`;
            this.isAbsorbed = false;
        }
        update(pileY) {
            this.x += this.vx;
            this.y += this.vy;
            if (this.y > -20) this.vy += 0.1;
            if (!this.isAbsorbed && this.y >= pileY) {
                this.isAbsorbed = true;
                this.vy = 0; this.vx = 0; this.y = pileY;
            }
            if (this.isAbsorbed) this.size -= 0.1;
            return this.size > 0;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
    }

    class Pulse {
        constructor() {
            this.r = 0;
            this.opacity = 1;
        }
        update() {
            this.r += 5;
            this.opacity -= 0.01;
            return this.opacity > 0;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(width/2, height/2, this.r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    function animate(time) {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 1);
        const end = new Date(now.getFullYear() + 1, 0, 1);
        const totalMs = end - start;
        const currentTotalSec = Math.floor(totalMs / 1000);
        const secondsPassed = Math.floor((now - start) / 1000);
        const secondsLeft = currentTotalSec - secondsPassed;

        // 60秒ごとのエフェクト判定
        if (secondsLeft % 60 === 0 && secondsLeft !== lastSecond) {
            pulses.push(new Pulse());
            lastSecond = secondsLeft;
        }

        // UI更新
        counterEl.innerText = secondsLeft.toLocaleString();
        totalEl.innerText = "/ " + currentTotalSec.toLocaleString();
        percentEl.innerText = "(" + ((secondsLeft / currentTotalSec) * 100).toFixed(4) + "%)";
        counterEl.style.color = `hsl(${hue}, 100%, 80%)`;
        percentEl.style.color = `hsl(${hue}, 100%, 70%)`;

        // 背景（残像を作るために薄く塗りつぶす）
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(0, 0, width, height);

        // 色の変化
        hue = (hue + 0.2) % 360;

        // 地層（波打ちアニメーション）
        const ratio = secondsPassed / currentTotalSec;
        const basePileY = height - (height * ratio);
        const waveY = basePileY + Math.sin(time * 0.002) * 10;

        let grad = ctx.createLinearGradient(0, waveY, 0, height);
        grad.addColorStop(0, `hsla(${hue}, 100%, 50%, 0.6)`);
        grad.addColorStop(1, `hsla(${(hue+40)%360}, 100%, 20%, 0.2)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, waveY);
        for(let x=0; x<=width; x+=10) {
            ctx.lineTo(x, waveY + Math.sin(x * 0.01 + time * 0.002) * 5);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // 粒の追加と更新
        if (Math.random() > 0.8) particles.push(new Particle());
        particles = particles.filter(p => {
            if (p.update(waveY)) { p.draw(); return true; }
            return false;
        });

        // 60秒パルスの更新
        pulses = pulses.filter(p => {
            if (p.update()) { p.draw(); return true; }
            return false;
        });

        requestAnimationFrame(animate);
    }

    function requestPermission() {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(res => {
                if (res === 'granted') window.addEventListener('devicemotion', shake);
            });
        } else {
            window.addEventListener('devicemotion', shake);
        }
        document.getElementById('permission-btn').style.display = 'none';
    }

    function shake(e) {
        let acc = e.accelerationIncludingGravity;
        if (Math.abs(acc.x) + Math.abs(acc.y) > 20) {
            for(let i=0; i<20; i++) particles.push(new Particle(true));
        }
    }

    animate(0);
</script>
</body>
</html>

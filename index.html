<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Progress Aqua Crystal</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        .ui-container {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
            color: white; pointer-events: none; z-index: 10; width: 95%;
        }

        .main-timer-wrapper {
            position: relative;
            text-align: center;
        }

        #counter { 
            font-size: 3.5rem; font-weight: 100; color: #ffffff; 
            text-shadow: 0 0 20px rgba(255,255,255,0.8); 
            margin: 0;
            line-height: 1.1;
        }

        .sub-stats {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 12px;
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
        }

        #total-seconds { font-size: 0.75rem; color: #ffffff; opacity: 0.3; font-weight: 100; }
        #percentage { font-size: 0.85rem; color: #ffffff; opacity: 0.6; text-shadow: 0 0 5px rgba(255,255,255,0.5); }

        .label { font-size: 0.6rem; letter-spacing: 2px; color: #ffffff; opacity: 0.5; margin-bottom: 5px; }
        
        #permission-btn {
            position: absolute; top: 25px; right: 25px;
            width: 50px; height: 50px;
            background: transparent; color: #00ffff; border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%; font-size: 9px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100; box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            transition: all 0.3s ease; text-align: center; line-height: 1.1;
        }
        #permission-btn:active { transform: scale(0.9); background: rgba(0, 255, 255, 0.2); }
        #permission-btn::before { content: "ACTIVATE\nSENSOR"; white-space: pre; }
    </style>
</head>
<body>

<button id="permission-btn" onclick="requestPermission()"></button>

<div class="ui-container">
    <div class="label">REMAINING SECONDS</div>
    <div class="main-timer-wrapper">
        <div id="counter">0</div>
        <div class="sub-stats">
            <span id="total-seconds">/ 0</span>
            <span id="percentage">(0.0000%)</span>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const counterEl = document.getElementById('counter');
    const totalEl = document.getElementById('total-seconds');
    const percentEl = document.getElementById('percentage');

    let width, height;
    let particles = [];
    let pulses = [];
    let lastSecond = -1;
    let currentWaveY = 0;

    // 指定の配色設定
    const COLOR_PARTICLE = 'rgba(0, 255, 255, 1)';
    const COLOR_WAVE_TOP = 'rgba(0, 255, 255, 0.7)';    // 水面の水色
    const COLOR_WAVE_BOTTOM = 'rgba(0, 10, 50, 0.8)';   // 底の濃紺

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor(isFlying = false) {
            this.init(isFlying);
        }
        init(isFlying) {
            this.x = Math.random() * width;
            this.y = isFlying ? height - 50 : -20;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = isFlying ? -(Math.random() * 15 + 5) : Math.random() * 2 + 1;
            this.size = Math.random() * 2 + 1;
            this.isAbsorbed = false;
            this.life = 1.0; 
            this.floatOffset = Math.random() * Math.PI * 2;
        }
        update(pileY) {
            if (!this.isAbsorbed) {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y > -20) this.vy += 0.1;
                if (this.y >= pileY) {
                    this.isAbsorbed = true;
                    this.y = pileY;
                }
            } else {
                // 水面をゆっくり漂う
                this.y = pileY + Math.sin(Date.now() * 0.001 + this.floatOffset) * 2;
                this.life -= 0.01;
                this.size *= 0.99;
            }
            return this.life > 0;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 255, 255, ${this.life})`;
            if (!this.isAbsorbed) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'cyan';
            }
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    class Pulse {
        constructor(startY) {
            this.x = width / 2;
            this.y = startY;
            this.r = 0;
            this.opacity = 0.8;
        }
        update() {
            this.r += 3; // パルスも少しゆっくりに
            this.opacity -= 0.006;
            return this.opacity > 0;
        }
        draw() {
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(this.x, this.y, this.r * 2.5, this.r * 0.6, 0, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0, 255, 255, ${this.opacity})`;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }
    }

    function animate(time) {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 1);
        const end = new Date(now.getFullYear() + 1, 0, 1);
        const totalMs = end - start;
        const currentTotalSec = Math.floor(totalMs / 1000);
        const secondsPassed = Math.floor((now - start) / 1000);
        const secondsLeft = currentTotalSec - secondsPassed;

        counterEl.innerText = secondsLeft.toLocaleString();
        totalEl.innerText = "/ " + currentTotalSec.toLocaleString();
        percentEl.innerText = "(" + ((secondsLeft / currentTotalSec) * 100).toFixed(4) + "%)";

        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, width, height);

        const ratio = secondsPassed / currentTotalSec;
        const basePileY = height - (height * ratio);
        // 波のスピードを大幅にダウン (0.002 -> 0.0008)
        currentWaveY = basePileY + Math.sin(time * 0.0008) * 8;

        if (secondsLeft % 60 === 0 && secondsLeft !== lastSecond) {
            pulses.push(new Pulse(currentWaveY));
            lastSecond = secondsLeft;
        }

        let grad = ctx.createLinearGradient(0, currentWaveY, 0, height);
        grad.addColorStop(0, COLOR_WAVE_TOP);
        grad.addColorStop(1, COLOR_WAVE_BOTTOM);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, currentWaveY);
        // 波の揺らぎもなだらかに
        for(let x=0; x<=width; x+=10) {
            ctx.lineTo(x, currentWaveY + Math.sin(x * 0.008 + time * 0.0008) * 6);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        if (Math.random() > 0.8) particles.push(new Particle());
        
        particles = particles.filter(p => { if (p.update(currentWaveY)) { p.draw(); return true; } return false; });
        pulses = pulses.filter(p => { if (p.update()) { p.draw(); return true; } return false; });

        requestAnimationFrame(animate);
    }

    function requestPermission() {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(res => {
                if (res === 'granted') window.addEventListener('devicemotion', shake);
            });
        } else {
            window.addEventListener('devicemotion', shake);
        }
        document.getElementById('permission-btn').style.display = 'none';
    }

    function shake(e) {
        let acc = e.accelerationIncludingGravity;
        if (Math.abs(acc.x) + Math.abs(acc.y) > 20) {
            for(let i=0; i<30; i++) particles.push(new Particle(true));
        }
    }

    animate(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Progress Crystal Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        .ui-main {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: white; pointer-events: none; z-index: 10; width: 90%;
        }
        #counter { font-size: 3.5rem; font-weight: 100; color: #ffffff; text-shadow: 0 0 20px rgba(255,255,255,0.8); margin-bottom: 2px; }
        .label { font-size: 0.6rem; letter-spacing: 2px; color: #ffffff; opacity: 0.5; }

        .ui-stats {
            position: absolute; bottom: 30px; right: 20px;
            text-align: right; color: white; pointer-events: none; z-index: 10;
            font-family: 'Courier New', Courier, monospace;
        }
        #total-seconds { font-size: 0.7rem; color: #ffffff; opacity: 0.3; font-weight: 100; margin-bottom: 2px; }
        #percentage { font-size: 0.9rem; color: #ffffff; opacity: 0.6; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        
        #permission-btn {
            position: absolute; top: 25px; right: 25px;
            width: 50px; height: 50px;
            background: transparent;
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            transition: all 0.3s ease;
            text-align: center;
            line-height: 1.1;
        }
        #permission-btn:active { transform: scale(0.9); background: rgba(0, 255, 255, 0.2); }
        #permission-btn::before { content: "ACTIVATE\nSENSOR"; white-space: pre; }
    </style>
</head>
<body>

<button id="permission-btn" onclick="requestPermission()"></button>

<div class="ui-main">
    <div class="label">REMAINING SECONDS</div>
    <div id="counter">0</div>
</div>

<div class="ui-stats">
    <div id="total-seconds">/ 0</div>
    <div id="percentage">(0.0000%)</div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const counterEl = document.getElementById('counter');
    const totalEl = document.getElementById('total-seconds');
    const percentEl = document.getElementById('percentage');

    let width, height;
    let particles = [];
    let pulses = [];
    let miniPulses = [];
    let lastSecond = -1;
    let currentWaveY = 0;

    const COLOR_PARTICLE = 'rgba(0, 255, 255, 1)';
    const COLOR_WAVE_TOP = 'rgba(0, 100, 255, 0.7)';
    const COLOR_WAVE_BOTTOM = 'rgba(0, 20, 100, 0.3)';

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor(isFlying = false) {
            this.init(isFlying);
        }
        init(isFlying) {
            this.x = Math.random() * width;
            this.y = isFlying ? height - 50 : -20;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = isFlying ? -(Math.random() * 15 + 5) : Math.random() * 2 + 1;
            this.size = Math.random() * 2 + 1;
            this.isAbsorbed = false;
            this.life = 1.0; 
            this.floatOffset = Math.random() * Math.PI * 2;
        }
        update(pileY) {
            if (!this.isAbsorbed) {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y > -20) this.vy += 0.1;

                if (this.y >= pileY) {
                    this.isAbsorbed = true;
                    this.y = pileY;
                    // 水面に落ちた瞬間に小さな波紋
                    if (Math.random() > 0.4) {
                        miniPulses.push(new MiniPulse(this.x, pileY));
                    }
                }
            } else {
                // 水面を浮遊するモーション
                this.y = pileY + Math.sin(Date.now() * 0.005 + this.floatOffset) * 2;
                this.life -= 0.015;
                this.size *= 0.99;
            }
            return this.life > 0;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 255, 255, ${this.life})`;
            if (!this.isAbsorbed) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'cyan';
            }
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    class MiniPulse {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.r = 0; this.opacity = 0.4;
        }
        update() {
            this.r += 0.8;
            this.opacity -= 0.015;
            return this.opacity > 0;
        }
        draw() {
            ctx.beginPath();
            ctx.ellipse(this.x, this.y, this.r * 2.5, this.r * 0.6, 0, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0, 255, 255, ${this.opacity})`;
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

        constructor

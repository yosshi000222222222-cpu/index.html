<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Aqua Glass Unified UI</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-container {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
            color: white; pointer-events: none; z-index: 10; width: 95%;
            transition: backdrop-filter 0.5s ease;
        }

        .wet-blur { backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }

        .main-timer-wrapper { position: relative; text-align: center; }
        #counter { font-size: 3.5rem; font-weight: 100; color: #ffffff; text-shadow: 0 0 20px rgba(255,255,255,0.8); margin: 0; line-height: 1.1; }
        .sub-stats { margin-top: 15px; display: flex; justify-content: center; align-items: baseline; gap: 12px; font-family: 'Courier New', Courier, monospace; width: 100%; }
        #total-seconds { font-size: 0.75rem; color: #ffffff; opacity: 0.6; font-weight: 100; }
        #percentage { font-size: 0.85rem; color: #ffffff; opacity: 0.8; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .label { font-size: 0.6rem; letter-spacing: 2px; color: #ffffff; opacity: 0.5; margin-bottom: 5px; }
        
        .day-progress-group {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 180px;
        }
        .day-gauge-container {
            width: 100%; height: 3px; background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden;
        }
        #day-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, transparent, #00ffff);
            box-shadow: 0 0 8px #00ffff;
            transition: width 1s linear;
        }
        .day-label {
            font-size: 0.5rem; color: #00ffff; opacity: 0.5; letter-spacing: 2px;
            margin-bottom: 6px;
        }

        /* 右上のトグルスイッチスタイル */
        .shake-toggle-container {
            position: absolute; top: 25px; right: 25px;
            z-index: 100; display: flex; align-items: center; gap: 8px;
            cursor: pointer; pointer-events: auto;
        }
        .shake-toggle-container input { display: none; }
        .slider {
            width: 34px; height: 18px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            border-radius: 10px; position: relative; transition: .3s;
        }
        .slider:before {
            content: ""; position: absolute; height: 12px; width: 12px;
            left: 2px; bottom: 2px; background: #550000; border-radius: 50%; transition: .3s;
        }
        input:checked + .slider { background: rgba(0,255,255,0.3); border-color: #00ffff; }
        input:checked + .slider:before { transform: translateX(16px); background: #00ffff; box-shadow: 0 0 10px #00ffff; }

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Aqua Glass Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* タイマーコンテナ：水滴があるときにボケる */
        .ui-container {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
            color: white; pointer-events: none; z-index: 10; width: 95%;
            transition: backdrop-filter 0.5s ease;
        }

        /* 水滴がついた時のボケ効果クラス */
        .wet-blur { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

        .main-timer-wrapper { position: relative; text-align: center; }
        #counter { font-size: 3.5rem; font-weight: 100; color: #ffffff; text-shadow: 0 0 20px rgba(255,255,255,0.8); margin: 0; line-height: 1.1; }
        .sub-stats { margin-top: 15px; display: flex; justify-content: center; align-items: baseline; gap: 12px; font-family: 'Courier New', Courier, monospace; width: 100%; }
        #total-seconds { font-size: 0.75rem; color: #ffffff; opacity: 0.6; font-weight: 100; }
        #percentage { font-size: 0.85rem; color: #ffffff; opacity: 0.8; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .label { font-size: 0.6rem; letter-spacing: 2px; color: #ffffff; opacity: 0.5; margin-bottom: 5px; }
        
        .motion-toggle { position: absolute; top: 25px; left: 25px; z-index: 100; display: flex; align-items: center; gap: 8px; cursor: pointer; pointer-events: auto; }
        .motion-toggle input { display: none; }
        .slider { width: 34px; height: 18px; background: rgba(255,255,255,0.1); border: 1px solid rgba(0,255,255,0.3); border-radius: 10px; position: relative; transition: .3s; }
        .slider:before { content: ""; position: absolute; height: 12px; width: 12px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: .3s; }
        input:checked + .slider { background: rgba(0,255,255,0.3); border-color: #00ffff; }
        input:checked + .slider:before { transform: translateX(16px); background: #00ffff; box-shadow: 0 0 10px #00ffff; }
        .toggle-label { color: #00ffff; font-size: 9px; font-weight: bold; letter-spacing: 1px; opacity: 0.7; }

        #permission-btn {
            position: absolute; top: 25px; right: 25px; width: 50px; height: 50px;
            background: transparent; color: #00ffff; border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%; font-size: 9px; font-weight: bold; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100; transition: all 0.3s ease; text-align: center; line-height: 1.1;
        }
        #permission-btn::before { content: "ACTIVATE\nSENSOR"; white-space: pre; }
    </style>
</head>
<body>

<label class="motion-toggle">
    <input type="checkbox" id="motionSwitch" checked>
    <div class="slider"></div>
    <span class="toggle-label">MOTION</span>
</label>

<button id="permission-btn" onclick="requestPermission()"></button>

<div class="ui-container" id="uiContainer">
    <div class="label">REMAINING SECONDS</div>
    <div class="main-timer-wrapper">
        <div id="counter">0</div>
        <div class="sub-stats">
            <span id="total-seconds">/ 0</span>
            <span id="percentage">(0.0000%)</span>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const counterEl = document.getElementById('counter');
    const totalEl = document.getElementById('total-seconds');
    const percentEl = document.getElementById('percentage');
    const uiContainer = document.getElementById('uiContainer');
    const motionSwitch = document.getElementById('motionSwitch');

    let width, height;
    let particles = [];
    let pulses = [];
    let droplets = [];
    let lastSecond = -1;
    let audioCtx = null;

    const COLOR_WAVE_TOP = 'rgba(0, 255, 255, 0.7)';
    const COLOR_WAVE_BOTTOM = 'rgba(0, 10, 50, 0.9)';

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 水滴クラス
    class Droplet {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.r = Math.random() * 5 + 2;
            this.life = 1.0;
            this.vy = Math.random() * 0.5 + 0.2; // ゆっくり垂れる
        }
        update() {
            this.y += this.vy;
            this.life -= 0.002;
            return this.life > 0;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${this.life * 0.2})`;
            ctx.fill();
            // ハイライト
            ctx.beginPath();
            ctx.arc(this.x - this.r*0.3, this.y - this.r*0.3, this.r*0.2, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255, 255, 255, ${this.life * 0.4})`;
            ctx.fill();
        }
    }

    // 効果音生成
    function playSplashSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(100 + Math.random() * 200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    function getWaveY(x, time, basePileY) {
        return basePileY + Math.sin(x * 0.008 + time * 0.0008) * 6;
    }

    class Particle {
        constructor(isFlying = false) {
            this.x = Math.random() * width;
            this.y = isFlying ? height - 50 : -20;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = isFlying ? -(Math.random() * 15 + 5) : Math.random() * 2 + 1;
            this.size = Math.random() * 2 + 1;
            this.isAbsorbed = false;
            this.life = 1.0; 
            this.floatOffset = Math.random() * Math.PI * 2;
        }
        update(time, basePileY) {
            const currentYAtX = getWaveY(this.x, time, basePileY);
            if (!this.isAbsorbed) {
                this.x += this.vx; this.y += this.vy;
                if (this.y > -20) this.vy += 0.1;
                if (this.y >= currentYAtX) { this.isAbsorbed = true; this.y = currentYAtX; }
            } else {
                this.y = currentYAtX + Math.sin(Date.now() * 0.001 + this.floatOffset) * 2;
                this.life -= 0.012; this.size *= 0.99;
            }
            return this.life > 0;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 255, 255, ${this.life})`;
            ctx.fill();
        }
    }

    class RisingPulse {
        constructor(startY) {
            this.x = width / 2; this.y = startY; this.r = 0; this.opacity = 1.0;
        }
        update() { this.r += 20; this.y -= 10; this.opacity -= 0.03; return this.opacity > 0; }
        draw() {
            ctx.beginPath();
            ctx.ellipse(this.x, this.y, this.r * 1.2, this.r, 0, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.lineWidth = 3; ctx.stroke();
        }
    }

    function animate(time) {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 1);
        const end = new Date(now.getFullYear() + 1, 0, 1);
        const currentTotalSec = Math.floor((end - start) / 1000);
        const secondsLeft = currentTotalSec - Math.floor((now - start) / 1000);

        counterEl.innerText = secondsLeft.toLocaleString();
        totalEl.innerText = "/ " + currentTotalSec.toLocaleString();
        percentEl.innerText = "(" + ((secondsLeft / currentTotalSec) * 100).toFixed(4) + "%)";

        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.fillRect(0, 0, width, height);

        const basePileY = height - (height * (1 - secondsLeft / currentTotalSec));

        if (secondsLeft % 60 === 0 && secondsLeft !== lastSecond) {
            pulses.push(new RisingPulse(getWaveY(width / 2, time, basePileY)));
            lastSecond = secondsLeft;
        }

        let grad = ctx.createLinearGradient(0, basePileY - 50, 0, height);
        grad.addColorStop(0, COLOR_WAVE_TOP);
        grad.addColorStop(1, COLOR_WAVE_BOTTOM);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, getWaveY(0, time, basePileY));
        for(let x=10; x<=width; x+=10) ctx.lineTo(x, getWaveY(x, time, basePileY));
        ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.fill();

        if (Math.random() > 0.8) particles.push(new Particle());
        
        particles = particles.filter(p => { if (p.update(time, basePileY)) { p.draw(); return true; } return false; });
        pulses = pulses.filter(p => { if (p.update()) { p.draw(); return true; } return false; });
        
        // 水滴の処理
        if (droplets.length > 0) uiContainer.classList.add('wet-blur');
        else uiContainer.classList.remove('wet-blur');
        droplets = droplets.filter(d => { if (d.update()) { d.draw(); return true; } return false; });

        requestAnimationFrame(animate);
    }

    function requestPermission() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(res => {
                if (res === 'granted') window.addEventListener('devicemotion', shake);
            });
        } else {
            window.addEventListener('devicemotion', shake);
        }
        document.getElementById('permission-btn').style.display = 'none';
    }

    function shake(e) {
        if (!motionSwitch.checked) return;
        let acc = e.accelerationIncludingGravity;
        if (Math.abs(acc.x) + Math.abs(acc.y) > 20) {
            playSplashSound();
            for(let i=0; i<30; i++) particles.push(new Particle(true));
            // 水滴を追加
            for(let i=0; i<5; i++) droplets.push(new Droplet());
        }
    }

    animate(0);
</script>
</body>
</html>

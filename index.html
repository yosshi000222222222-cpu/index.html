<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Aqua Glass - Accumulate Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-container {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
            color: white; pointer-events: none; z-index: 10; width: 100%;
        }

        .wet-blur { backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }

        .main-timer-wrapper { position: relative; text-align: center; width: 100%; }
        
        #counter { 
            font-size: 3.5rem; font-weight: bold; color: #ffffff; 
            text-shadow: 0 0 20px rgba(255,255,255,0.8); margin: 0; line-height: 1.1; 
        }
        
        .sub-stats { margin-top: 15px; display: flex; justify-content: center; align-items: baseline; gap: 12px; width: 100%; }
        #total-seconds { font-size: 0.75rem; color: #ffffff; opacity: 0.6; }
        #percentage { font-size: 0.85rem; color: #00ffff; text-shadow: 0 0 5px rgba(0,255,255,0.5); }
        .label { font-size: 0.6rem; letter-spacing: 2px; color: #ffffff; opacity: 0.5; margin-bottom: 5px; }
        
        .day-progress-group {
            margin-top: 50px; display: flex; flex-direction: column; width: 100%; position: relative;
        }
        .day-gauge-container {
            width: 100%; height: 4px; background: rgba(255,255,255,0.05); position: relative;
        }
        #day-bar {
            height: 100%; width: 0%; background: linear-gradient(90deg, transparent, #00ffff);
            box-shadow: 0 0 15px #00ffff; position: absolute; top: 0; left: 0; z-index: 2;
        }
        
        .scale-marks {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: space-between; z-index: 3;
        }
        .mark {
            width: 1px; height: 10px; background: rgba(0, 255, 255, 0.2); position: relative; top: -3px;
        }
        .mark::after {
            content: attr(data-hour); position: absolute; top: 12px; left: 50%;
            transform: translateX(-50%); font-size: 8px; color: rgba(0, 255, 255, 0.4);
        }

        .day-info-row {
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 15px; margin-top: 15px;
        }
        .day-label { font-size: 0.5rem; color: #00ffff; opacity: 0.4; letter-spacing: 2px; }
        #day-percentage-text { font-size: 0.85rem; color: #00ffff; text-shadow: 0 0 8px #00ffff; font-weight: bold; }

        .shake-toggle-container {
            position: absolute; top: 25px; right: 25px; z-index: 100; display: flex; align-items: center; gap: 8px; cursor: pointer; pointer-events: auto;
        }
        .shake-toggle-container input { display: none; }
        .slider { width: 40px; height: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,0,0,0.2); border-radius: 10px; position: relative; transition: .3s; }
        .slider:before { content: ""; position: absolute; height: 14px; width: 14px; left: 2px; bottom: 2px; background: #440000; border-radius: 50%; transition: .3s; }
        input:checked + .slider { border-color: #00ffff; background: rgba(0,255,255,0.15); }
        input:checked + .slider:before { transform: translateX(20px); background: #00ffff; box-shadow: 0 0 10px #00ffff; }
        .toggle-label { color: #440000; font-size: 9px; font-weight: bold; letter-spacing: 1px; }
        input:checked ~ .toggle-label { color: #00ffff; }
    </style>
</head>
<body>

<label class="shake-toggle-container">
    <input type="checkbox" id="shakeSwitch" onchange="toggleShake()">
    <div class="slider"></div>
    <span class="toggle-label">SHAKE</span>
</label>

<div class="ui-container" id="uiContainer">
    <div class="label">REMAINING SECONDS</div>
    <div class="main-timer-wrapper">
        <div id="counter">---</div>
        <div class="sub-stats">
            <span id="total-seconds"></span>
            <span id="percentage"></span>
        </div>
        
        <div class="day-progress-group">
            <div class="day-gauge-container">
                <div id="day-bar"></div>
                <div class="scale-marks">
                    <div class="mark" data-hour="0"></div><div class="mark" data-hour="4"></div>
                    <div class="mark" data-hour="8"></div><div class="mark" data-hour="12"></div>
                    <div class="mark" data-hour="16"></div><div class="mark" data-hour="20"></div>
                    <div class="mark" data-hour="24"></div>
                </div>
            </div>
            <div class="day-info-row">
                <div class="day-label">TODAY'S PROGRESS</div>
                <div id="day-percentage-text">0.00%</div>
            </div>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const counterEl = document.getElementById('counter');
    const totalEl = document.getElementById('total-seconds');
    const percentEl = document.getElementById('percentage');
    const dayBar = document.getElementById('day-bar');
    const dayPercentText = document.getElementById('day-percentage-text');
    const uiContainer = document.getElementById('uiContainer');
    const shakeSwitch = document.getElementById('shakeSwitch');

    let width, height, audioCtx = null;
    let particles = [], droplets = [], pulses = [];
    let currentYearRatio = 0;
    let lastPulseSecond = -1;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 60秒パルスエフェクト
    class RisingPulse {
        constructor(startY) {
            this.x = width / 2; this.y = startY; this.r = 0; this.opacity = 1.0;
        }
        update() { 
            this.r += 15; this.y -= 8; this.opacity -= 0.02; 
            return this.opacity > 0; 
        }
        draw() {
            ctx.beginPath();
            ctx.ellipse(this.x, this.y, this.r * 2, this.r, 0, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.lineWidth = 1.5; ctx.stroke();
        }
    }

    class Particle {
        constructor(isFlying = false) {
            this.x = Math.random() * width;
            this.y = isFlying ? height - 50 : -20;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = isFlying ? -(Math.random() * 12 + 5) : Math.random() * 2 + 1;
            this.size = Math.random() * 2 + 1;
            this.life = 1.0;
        }
        update(waveY) {
            this.x += this.vx; this.y += this.vy;
            if (this.y >= waveY) { this.life = 0; }
            return this.life > 0;
        }
        draw() {
            ctx.fillStyle = `rgba(0, 255, 255, ${this.life})`;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
        }
    }

    class Droplet {
        constructor() {
            this.x = Math.random() * width; this.y = Math.random() * height;
            this.r = Math.random() * 5 + 1; this.life = 1.0; this.vy = this.r * 0.05;
        }
        update() { this.y += this.vy; this.life -= 0.002; return this.life > 0; }
        draw() {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.life * 0.2})`;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        }
    }

    function animate(t) {
        const now = new Date();
        const year = now.getFullYear();
        const startYear = new Date(year, 0, 1).getTime();
        const endYear = new Date(year + 1, 0, 1).getTime();
        const nowMs = now.getTime();
        const totalYearMs = endYear - startYear;
        const remainingMs = Math.max(0, endYear - nowMs);
        const secondsLeft = Math.floor(remainingMs / 1000);
        
        currentYearRatio = remainingMs / totalYearMs;

        // UI更新
        counterEl.textContent = secondsLeft.toLocaleString();
        totalEl.textContent = "/ " + Math.floor(totalYearMs / 1000).toLocaleString();
        percentEl.textContent = "(" + (currentYearRatio * 100).toFixed(4) + "%)";

        const startDay = new Date(year, now.getMonth(), now.getDate()).getTime();
        const dayProgress = (nowMs - startDay) / (24 * 60 * 60 * 1000);
        dayBar.style.width = (dayProgress * 100) + "%";
        dayPercentText.textContent = (dayProgress * 100).toFixed(2) + "%";

        // 背景描画
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, width, height);

        // 水位の計算：秒数が減るほど水位が上がる (Ratio=1でbottom, Ratio=0でtop)
        const basePileY = height * currentYearRatio; 
        const waveY = basePileY + Math.sin(t * 0.002) * 6;

        // 60秒パルス判定
        if (secondsLeft % 60 === 0 && secondsLeft !== lastPulseSecond) {
            pulses.push(new RisingPulse(waveY));
            lastPulseSecond = secondsLeft;
        }

        // 波の描画
        let grad = ctx.createLinearGradient(0, basePileY - 50, 0, height);
        grad.addColorStop(0, 'rgba(0, 255, 255, 0.6)');
        grad.addColorStop(1, 'rgba(0, 20, 60, 0.9)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, waveY);
        for(let x=0; x<=width; x+=20) {
            ctx.lineTo(x, basePileY + Math.sin(x*0.01 + t*0.002)*6);
        }
        ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.fill();

        // 各種エフェクト更新
        if (Math.random() > 0.85) particles.push(new Particle());
        particles = particles.filter(p => { if (p.update(waveY)) { p.draw(); return true; } return false; });
        pulses = pulses.filter(p => { if (p.update()) { p.draw(); return true; } return false; });
        droplets = droplets.filter(d => { if (d.update()) { d.draw(); return true; } return false; });
        
        uiContainer.className = droplets.length > 0 ? "ui-container wet-blur" : "ui-container";

        requestAnimationFrame(animate);
    }

    async function toggleShake() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (shakeSwitch.checked) {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const res = await DeviceMotionEvent.requestPermission();
                    if (res !== 'granted') { shakeSwitch.checked = false; return; }
                } catch(e) {}
            }
            window.addEventListener('devicemotion', handleShake);
        } else {
            window.removeEventListener('devicemotion', handleShake);
        }
    }

    function handleShake(e) {
        let acc = e.accelerationIncludingGravity;
        if (acc && (Math.abs(acc.x) + Math.abs(acc.y) > 22)) {
            if (audioCtx && audioCtx.state === 'running') {
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.frequency.setValueAtTime(120, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.3);
            }
            const waveY = height * currentYearRatio;
            for(let i=0; i<20; i++) particles.push(new Particle(true));
            for(let i=0; i<5; i++) droplets.push(new Droplet());
        }
    }

    animate(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Aqua Glass Wide</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-container {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
            color: white; pointer-events: none; z-index: 10; width: 100%; /* 幅いっぱいに */
            transition: backdrop-filter 0.5s ease;
        }

        .wet-blur { backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }

        .main-timer-wrapper { position: relative; text-align: center; width: 100%; }
        
        /* タイマーの文字サイズを安定版（3.5rem）に固定 */
        #counter { 
            font-size: 3.5rem; font-weight: 100; color: #ffffff; 
            text-shadow: 0 0 20px rgba(255,255,255,0.8); margin: 0; line-height: 1.1; 
        }
        
        .sub-stats { margin-top: 15px; display: flex; justify-content: center; align-items: baseline; gap: 12px; width: 100%; }
        #total-seconds { font-size: 0.75rem; color: #ffffff; opacity: 0.6; font-weight: 100; }
        #percentage { font-size: 0.85rem; color: #ffffff; opacity: 0.8; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .label { font-size: 0.6rem; letter-spacing: 2px; color: #ffffff; opacity: 0.5; margin-bottom: 5px; }
        
        /* デイリープログレスゲージを幅いっぱいに設定 */
        .day-progress-group {
            margin-top: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%; /* 親要素に対して100% */
        }
        .day-gauge-container {
            width: 100%; height: 2px; background: rgba(255,255,255,0.05);
            position: relative; overflow: hidden;
        }
        #day-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            box-shadow: 0 0 15px #00ffff;
            transition: width 0.5s ease;
        }
        .day-label {
            font-size: 0.5rem; color: #00ffff; opacity: 0.4; letter-spacing: 4px;
            margin-bottom: 8px; text-transform: uppercase;
        }

        /* 右上のトグルスイッチ */
        .shake-toggle-container {
            position: absolute; top: 25px; right: 25px;
            z-index: 100; display: flex; align-items: center; gap: 8px;
            cursor: pointer; pointer-events: auto;
        }
        .shake-toggle-container input { display: none; }
        .slider {
            width: 40px; height: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,0,0,0.2);
            border-radius: 10px; position: relative; transition: .3s;
        }
        .slider:before {
            content: ""; position: absolute; height: 14px; width: 14px;
            left: 2px; bottom: 2px; background: #440000; border-radius: 50%; transition: .3s;
        }
        input:checked + .slider { border-color: #00ffff; background: rgba(0,255,255,0.15); }
        input:checked + .slider:before { transform: translateX(20px); background: #00ffff; box-shadow: 0 0 10px #00ffff; }
        .toggle-label { color: #440000; font-size: 9px; font-weight: bold; letter-spacing: 1px; transition: .3s; }
        input:checked ~ .toggle-label { color: #00ffff; opacity: 0.8; }

    </style>
</head>
<body>

<label class="shake-toggle-container">
    <input type="checkbox" id="shakeSwitch" onchange="toggleShake()">
    <div class="slider"></div>
    <span class="toggle-label">SHAKE</span>
</label>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Aqua Glass Robust</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-container {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
            color: white; pointer-events: none; z-index: 10; width: 95%;
            transition: backdrop-filter 0.5s ease;
        }

        .wet-blur { backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }

        .main-timer-wrapper { position: relative; text-align: center; }
        
        /* 文字を明るく、見やすく調整 */
        #counter { 
            font-size: 3.2rem; font-weight: bold; color: #ffffff; 
            text-shadow: 0 0 25px rgba(255,255,255,0.9), 0 0 10px rgba(0,255,255,0.8); 
            margin: 0; line-height: 1.1; 
        }
        
        .sub-stats { margin-top: 15px; display: flex; justify-content: center; align-items: baseline; gap: 10px; width: 100%; }
        #total-seconds { font-size: 0.75rem; color: #cccccc; }
        #percentage { font-size: 0.9rem; color: #00ffff; text-shadow: 0 0 8px rgba(0,255,255,0.8); }
        .label { font-size: 0.7rem; letter-spacing: 2px; color: #aaaaaa; margin-bottom: 5px; }
        
        .day-progress-group {
            margin-top: 30px; display: flex; flex-direction: column; align-items: center; width: 80%; max-width: 300px;
        }
        .day-gauge-container { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
        #day-bar { height: 100%; width: 0%; background: #00ffff; box-shadow: 0 0 10px #00ffff; transition: width 0.5s; }
        .day-label { font-size: 0.6rem; color: #00ffff; opacity: 0.8; letter-spacing: 2px; margin-bottom: 8px; }

        .shake-toggle-container {
            position: absolute; top: 25px; right: 25px; z-index: 100; display: flex; align-items: center; gap: 8px; cursor: pointer; pointer-events: auto;
        }
        .shake-toggle-container input { display: none; }
        .slider { width: 40px; height: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,0,0,0.3); border-radius: 10px; position: relative; transition: .3s; }
        .slider:before { content: ""; position: absolute; height: 14px; width: 14px; left: 2px; bottom: 2px; background: #550000; border-radius: 50%; transition: .3s; }
        input:checked + .slider { border-color: #00ffff; background: rgba(0,255,255,0.2); }
        input:checked + .slider:before { transform: translateX(20px); background: #00ffff; box-shadow: 0 0 10px #00ffff; }
        .toggle-label { color: #550000; font-size: 10px; font-weight: bold; letter-spacing: 1px; transition: .3s; }
        input:checked ~ .toggle-label { color: #00ffff; }
    </style>
</head>
<body>

<label class="shake-toggle-container">
    <input type="checkbox" id="shakeSwitch" onchange="toggleShake()">
    <div class="slider"></div>
    <span class="toggle-label">SHAKE</span>
</label>

<div class="ui-container" id="uiContainer">
    <div class="label">REMAINING SECONDS</div>
    <div class="main-timer-wrapper">
        <div id="counter">Loading...</div>
        <div class="sub-stats">
            <span id="total-seconds"></span>
            <span id="percentage"></span>
        </div>
        
        <div class="day-progress-group">
            <div class="day-label">TODAY'S PROGRESS</div>
            <div class="day-gauge-container">
                <div id="day-bar"></div>
            </div>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

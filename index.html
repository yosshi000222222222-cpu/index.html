<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Skyblue Glass - Refined Progress</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-container {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
            color: white; pointer-events: none; z-index: 10; width: 100%;
        }

        .main-timer-wrapper { position: relative; text-align: center; width: 100%; }
        
        #counter { 
            font-size: 3.5rem; font-weight: bold; color: #ffffff; 
            text-shadow: 0 0 20px rgba(255,255,255,0.8); margin: 0; line-height: 1.1; 
        }
        
        .sub-stats { margin-top: 15px; display: flex; justify-content: center; align-items: baseline; gap: 12px; width: 100%; }
        #total-seconds { font-size: 0.75rem; color: #ffffff; opacity: 0.6; }
        /* タイマー側の％サイズ：0.85rem */
        #percentage { font-size: 0.85rem; color: #29b6f6; text-shadow: 0 0 5px rgba(41, 182, 246, 0.5); }
        .label { font-size: 0.6rem; letter-spacing: 2px; color: #ffffff; opacity: 0.5; margin-bottom: 5px; }
        
        .day-progress-group {
            margin-top: 70px; display: flex; flex-direction: column; 
            width: 94%; margin-left: auto; margin-right: auto;
            position: relative;
        }
        .day-gauge-container {
            width: 100%; height: 2px; background: rgba(255,255,255,0.1); position: relative;
        }
        #day-bar {
            height: 100%; width: 0%; background: linear-gradient(90deg, transparent, #29b6f6);
            box-shadow: 0 0 15px #29b6f6; position: absolute; top: 0; left: 0; z-index: 2;
        }
        
        .scale-marks {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: space-between; z-index: 3;
        }
        .mark { width: 1px; height: 10px; background: rgba(41, 182, 246, 0.3); position: relative; top: -4px; }
        
        /* 目盛り数字をゲージの上に配置 */
        .mark::after {
            content: attr(data-hour); position: absolute; 
            bottom: 14px; left: 50%; transform: translateX(-50%); 
            font-size: 8px; color: rgba(41, 182, 246, 0.5);
        }

        .day-info-row {
            display: flex; justify-content: flex-end; 
            padding-top: 12px;
        }
        /* デイリーの％をタイマー側の％と同じサイズ（0.85rem）に修正 */
        #day-percentage-text { 
            font-size: 0.85rem; 
            color: #29b6f6; 
            text-shadow: 0 0 5px rgba(41, 182, 246, 0.5); 
            font-weight: bold; 
        }

        .shake-toggle-container {
            position: absolute; top: 25px; right: 25px; z-index: 100; display: flex; align-items: center; gap: 8px; cursor: pointer; pointer-events: auto;
        }
        .shake-toggle-container input { display: none; }
        .slider { width: 40px; height: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,0,0,0.2); border-radius: 10px; position: relative; transition: .3s; }
        .slider:before { content: ""; position: absolute; height: 14px; width: 14px; left: 2px; bottom: 2px; background: #440000; border-radius: 50%; transition: .3s; }
        input:checked + .slider { border-color: #29b6f6; background: rgba(41, 182, 246, 0.2); }
        input:checked + .slider:before { transform: translateX(20px); background: #29b6f6; box-shadow: 0 0 10px #29b6f6; }
        .toggle-label { color: #440000; font-size: 9px; font-weight: bold; letter-spacing: 1px; }
        input:checked ~ .toggle-label { color: #29b6f6; }
    </style>
</head>
<body>

<label class="shake-toggle-container">
    <input type="checkbox" id="shakeSwitch" onchange="toggleShake()">
    <div class="slider"></div>
    <span class="toggle-label">SHAKE</span>
</label>

<div class="ui-container" id="uiContainer">
    <div class="label">REMAINING SECONDS (2026)</div>
    <div class="main-timer-wrapper">
        <div id="counter">---</div>
        <div class="sub-stats">
            <span id="total-seconds"></span>
            <span id="percentage"></span>
        </div>
        
        <div class="day-progress-group">
            <div class="day-gauge-container">
                <div id="day-bar"></div>
                <div class="scale-marks">
                    <div class="mark" data-hour="0"></div><div class="mark" data-hour="4"></div>
                    <div class="mark" data-hour="8"></div><div class="mark" data-hour="12"></div>
                    <div class="mark" data-hour="16"></div><div class="mark" data-hour="20"></div>
                    <div class="mark" data-hour="24"></div>
                </div>
            </div>
            <div class="day-info-row">
                <div id="day-percentage-text">0.00%</div>
            </div>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const counterEl = document.getElementById('counter');
    const totalEl = document.getElementById('total-seconds');
    const percentEl = document.getElementById('percentage');
    const dayBar = document.getElementById('day-bar');
    const dayPercentText = document.getElementById('day-percentage-text');
    const shakeSwitch = document.getElementById('shakeSwitch');

    let width, height, audioCtx = null;
    let particles = [], pulses = [];
    let currentYearRatio = 0;
    let lastSec = -1;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class RisingPulse {
        constructor(startY) {
            this.x = width / 2; this.y = startY; this.r = 0; this.opacity = 1.0;
        }
        update() { this.r += 12; this.y -= 5; this.opacity -= 0.02; return this.opacity > 0; }
        draw() {
            ctx.beginPath();
            ctx.ellipse(this.x, this.y, this.r * 2.5, this.r, 0, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.lineWidth = 2; ctx.stroke();
        }
    }

    class Particle {
        constructor(isFlying = false) {
            this.x = Math.random() * width;
            this.y = isFlying ? height - 50 : -20;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = isFlying ? -(Math.random() * 12 + 5) : Math.random() * 2 + 1;
            this.size = Math.random() * 2 + 1;
        }
        update(waveYAtX) {
            this.x += this.vx; this.y += this.vy;
            return (this.y < waveYAtX);
        }
        draw() {
            ctx.fillStyle = `rgba(41, 182, 246, 0.8)`;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
        }
    }

    function animate(t) {
        const now = new Date();
        const year = 2026;
        const startYear = new Date(year, 0, 1).getTime();
        const endYear = new Date(year + 1, 0, 1).getTime();
        const nowMs = now.getTime();
        
        const totalYearSec = (endYear - startYear) / 1000;
        const remainingSec = Math.max(0, (endYear - nowMs) / 1000);
        currentYearRatio = remainingSec / totalYearSec;

        const floorSec = Math.floor(remainingSec);
        counterEl.textContent = floorSec.toLocaleString();
        totalEl.textContent = "/ " + Math.floor(totalYearSec).toLocaleString();
        percentEl.textContent = "(" + (currentYearRatio * 100).toFixed(4) + "%)";

        const startDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const dayPassedRatio = (nowMs - startDay) / (24 * 60 * 60 * 1000);
        dayBar.style.width = (dayPassedRatio * 100) + "%";
        dayPercentText.textContent = (dayPassedRatio * 100).toFixed(2) + "%";

        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, width, height);

        const basePileY = height * currentYearRatio; 

        if (floorSec % 60 === 0 && floorSec !== lastSec) {
            pulses.push(new RisingPulse(basePileY));
            lastSec = floorSec;
        }

        let grad = ctx.createLinearGradient(0, basePileY - 100, 0, height);
        grad.addColorStop(0, 'rgba(0, 255, 255, 0.7)');
        grad.addColorStop(1, 'rgba(0, 15, 50, 0

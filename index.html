<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Aqua Glass Reborn</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-container {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
            color: white; pointer-events: none; z-index: 10; width: 95%;
            transition: backdrop-filter 0.5s ease;
        }

        .wet-blur { backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }

        .main-timer-wrapper { position: relative; text-align: center; }
        
        #counter { 
            font-size: 3.5rem; font-weight: 100; color: #ffffff; 
            text-shadow: 0 0 20px rgba(255,255,255,0.8); margin: 0; line-height: 1.1; 
        }
        
        .sub-stats { margin-top: 15px; display: flex; justify-content: center; align-items: baseline; gap: 12px; width: 100%; }
        #total-seconds { font-size: 0.75rem; color: #ffffff; opacity: 0.6; font-weight: 100; }
        #percentage { font-size: 0.85rem; color: #ffffff; opacity: 0.8; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .label { font-size: 0.6rem; letter-spacing: 2px; color: #ffffff; opacity: 0.5; margin-bottom: 5px; }
        
        /* 追加機能1: 1日の進捗ゲージ（中央配置） */
        .day-progress-group {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
        }
        .day-gauge-container {
            width: 100%; height: 3px; background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden;
        }
        #day-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, transparent, #00ffff);
            box-shadow: 0 0 8px #00ffff;
        }
        .day-label {
            font-size: 0.5rem; color: #00ffff; opacity: 0.6; letter-spacing: 2px;
            margin-bottom: 8px;
        }

        /* 追加機能2: 右上のトグルスイッチ */
        .shake-toggle-container {
            position: absolute; top: 25px; right: 25px;
            z-index: 100; display: flex; align-items: center; gap: 8px;
            cursor: pointer; pointer-events: auto;
        }
        .shake-toggle-container input { display: none; }
        .slider {
            width: 40px; height: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            border-radius: 10px; position: relative; transition: .3s;
        }
        .slider:before {
            content: ""; position: absolute; height: 14px; width: 14px;
            left: 2px; bottom: 2px; background: #550000; border-radius: 50%; transition: .3s;
        }
        input:checked + .slider { border-color: #00ffff; background: rgba(0,255,255,0.2); }
        input:checked + .slider:before { transform: translateX(20px); background: #00ffff; box-shadow: 0 0 10px #00ffff; }
        .toggle-label { color: #550000; font-size: 10px; font-weight: bold; letter-spacing: 1px; transition: .3s; }
        input:checked ~ .toggle-label { color: #00ffff; }

    </style>
</head>
<body>

<label class="shake-toggle-container">
    <input type="checkbox" id="shakeSwitch" onchange="toggleShake()">
    <div class="slider"></div>
    <span class="toggle-label">SHAKE</span>
</label>

<div class="ui-container" id="uiContainer">
    <div class="label">REMAINING SECONDS</div>
    <div class="main-timer-wrapper">
        <div id="counter">Loading...</div>
        <div class="sub-stats">
            <span id="total-seconds"></span>
            <span id="percentage"></span>
        </div>
        
        <div class="day-progress-group">
            <div class="day-label">TODAY'S PROGRESS</div>
            <div class="day-gauge-container">
                <div id="day-bar"></div>
            </div>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const counterEl = document.getElementById('counter');
    const totalEl = document.getElementById('total-seconds');
    const percentEl = document.getElementById('percentage');
    const dayBar = document.getElementById('day-bar'); // 追加
    const uiContainer = document.getElementById('uiContainer');
    const shakeSwitch = document.getElementById('shakeSwitch'); // 追加

    let width, height;
    let particles = [];
    let pulses = [];
    let droplets = [];
    let lastSecond = -1;
    let audioCtx = null;

    const COLOR_WAVE_TOP = 'rgba(0, 255, 255, 0.7)';
    const COLOR_WAVE_BOTTOM = 'rgba(0, 10, 50, 0.9)';

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Droplet {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.r = Math.random() * Math.random() * 7 + 1;
            this.life = 1.0;
            this.vy = this.r * 0.05;
        }
        update() {
            this.y += this.vy;
            this.life -= 0.0015;
            return this.life > 0;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${this.life * 0.25})`;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.x - this.r*0.3, this.y - this.r*0.3, this.r*0.2, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255, 255, 255, ${this.life * 0.5})`;
            ctx.fill();
        }
    }

    function playSplashSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(80 + Math.random() * 150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }

    function getWaveY(x, time, basePileY) {
        return basePileY + Math.sin(x * 0.008 + time * 0.0008) * 6;
    }

    class Particle {
        constructor(isFlying = false) {
            this.x = Math.random() * width;
            this.y = isFlying ? height - 50 : -20;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = isFlying ? -(Math.random() * 15 + 5) : Math.random() * 2 + 1;
            this.size = Math.random() * 2 + 1;
            this.isAbsorbed = false;
            this.life = 1.0; 
            this.floatOffset = Math.random() * Math.PI * 2;
        }
        update(time, basePileY) {
            const currentYAtX = getWaveY(this.x, time, basePileY);
            if (!this.isAbsorbed) {
                this.x += this.vx; this.y += this.vy;
                if (this.y > -20) this.vy += 0.1;
                if (this.y >= currentYAtX) { this.isAbsorbed = true; this.y = currentYAtX; }
            } else {
                this.y = currentYAtX + Math.sin(Date.now() * 0.001 + this.floatOffset) * 2;
                this.life -= 0.012; this.size *= 0.99;
            }
            return this.life > 0;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 255, 255, ${this.life})`;
            ctx.fill();
        }
    }

    class RisingPulse {
        constructor(startY) {
            this.x = width / 2; this.y = startY; this.r = 0; this.opacity = 1.0;
        }
        update() { this.r += 20; this.y -= 10; this.opacity -= 0.03; return this.opacity > 0; }
        draw() {
            ctx.beginPath();
            ctx.ellipse(this.x, this.y, this.r * 1.5, this.r, 0, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.lineWidth = 2; ctx.stroke();
        }
    }

    function animate(time) {
        const now = new Date();
        // 年の計算（ここが基盤です）
        const yearStart = new Date(now.getFullYear(), 0, 1);
        const yearEnd = new Date(now.getFullYear() + 1, 0, 1);
        const yearTotalSec = Math.floor((yearEnd - yearStart) / 1000);
        const yearSecondsLeft = yearTotalSec - Math.floor((now - yearStart) / 1000);

        // UI更新
        counterEl.innerText = yearSecondsLeft.toLocaleString();
        totalEl.innerText = "/ " + yearTotalSec.toLocaleString();
        percentEl.innerText = "(" + ((yearSecondsLeft / yearTotalSec) * 100).toFixed(4) + "%)";

        // 1日の計算（ここを追加しました）
        const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const dayPassedSec = Math.floor((now - dayStart) / 1000);
        const dayProgress = (dayPassedSec / 86400) * 100;
        if(dayBar) dayBar.style.width = dayProgress + "%";

        // 描画クリア
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.fillRect(0, 0, width, height);

        const basePileY = height - (height * (1 - yearSecondsLeft / yearTotalSec));

        if (yearSecondsLeft % 60 === 0 && yearSecondsLeft !== lastSecond) {
            pulses.push(new RisingPulse(getWaveY(width / 2, time, basePileY)));
            lastSecond = yearSecondsLeft;
        }

        let grad = ctx.createLinearGradient(0, basePileY - 50, 0, height);
        grad.addColorStop(0, COLOR_WAVE_TOP);
        grad.addColorStop(1, COLOR_WAVE_BOTTOM);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, getWaveY(0, time, basePileY));
        for(let x=10; x<=width; x+=10) ctx.lineTo(x, getWaveY(x, time, basePileY));
        ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.fill();

        if (Math.random() > 0.8) particles.push(new Particle());
        
        particles = particles.filter(p => { if (p.update(time, basePileY)) { p.draw(); return true; } return false; });
        pulses = pulses.filter(p => { if (p.update()) { p.draw(); return true; } return false; });
        
        if (droplets.length > 0) uiContainer.classList.add('wet-blur');
        else uiContainer.classList.remove('wet-blur');
        droplets = droplets.filter(d => { if (d.update()) { d.draw(); return true; } return false; });

        requestAnimationFrame(animate);
    }

    // シェイクのトグル処理
    async function toggleShake() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // チェックボックスの状態を確認
        if (shakeSwitch.checked) {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const res = await DeviceMotionEvent.requestPermission();
                    if (res !== 'granted') {
                        shakeSwitch.checked = false; // 許可されなければOFFに戻す
                        return;
                    }
                } catch(e) {
                    console.error(e);
                }
            }
            window.addEventListener('devicemotion', handleShake);
        } else {
            window.removeEventListener('devicemotion', handleShake);
        }
    }

    function handleShake(e) {
        let acc = e.accelerationIncludingGravity;
        if (!acc) return;
        if (Math.abs(acc.x) + Math.abs(acc.y) > 22) {
            playSplashSound();
            for(let i=0; i<30; i++) particles.push(new Particle(true));
            for(let i=0; i<8; i++) droplets.push(new Droplet());
        }
    }

    animate(0);
</script>
</body>
</html>
